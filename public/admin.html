<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD BUSCAS - Painel Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #050b14; color: #fff; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,255,204,0.2); padding-bottom: 15px; margin-bottom: 25px; }
        .header h1 { color: #00ffcc; font-size: 1.5rem; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .back-btn { background: #1a2639; color: #00ffcc; border: 1px solid #00ffcc; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.8rem; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: linear-gradient(135deg, #0f1c2e, #162a45); border: 1px solid rgba(0,255,204,0.2); border-radius: 10px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .stat-card h3 { color: #8a99ad; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .value { color: #00ffcc; font-size: 1.8rem; font-weight: bold; }
        .stat-card .value.money { color: #00b894; }

        .section-title { font-size: 1.1rem; color: #fff; margin-bottom: 15px; border-left: 3px solid #00ffcc; padding-left: 10px; }
        
        .table-container { background: #0f1c2e; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background: #162a45; color: #00ffcc; padding: 12px 15px; font-weight: 600; }
        td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #c0d0e0; }
        tr:last-child td { border-bottom: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>🛡️ MD BUSCAS // ADMIN DASHBOARD</h1>
    <a href="/" class="back-btn">Voltar ao Site</a>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <h3>Faturamento Total (Pix)</h3>
        <div class="value money" id="fat-total">R$ 0,00</div>
    </div>
    <div class="stat-card">
        <h3>Total de Puxadas</h3>
        <div class="value" id="puxadas-total">0</div>
    </div>
    <div class="stat-card">
        <h3>Consultas CPF</h3>
        <div class="value" id="puxadas-cpf">0</div>
    </div>
    <div class="stat-card">
        <h3>Consultas CNPJ</h3>
        <div class="value" id="puxadas-cnpj">0</div>
    </div>
</div>

<div class="section-title">Atividade Recente dos Módulos</div>
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Horário</th>
                <th>Módulo</th>
                <th>Consulta / Alvo</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tabela-logs">
            <tr>
                <td>00:00:12</td>
                <td>CNPJ</td>
                <td>12.345.678/0001-99</td>
                <td><span style="color: #00b894;">Sucesso</span></td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // Função que gera o bipe sonoro igual ao do iFood
    function tocarBeepIfood() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch (e) {
            console.log("Áudio bloqueado pelo navegador até haver interação.");
        }
    }

    // Função chamada quando houver nova consulta
    function registrarNovaConsulta(modulo, alvo) {
        tocarBeepIfood();
        
        let totalPuxadas = document.getElementById('puxadas-total');
        totalPuxadas.innerText = parseInt(totalPuxadas.innerText) + 1;

        let tabela = document.getElementById('tabela-logs');
        let agora = new Date().toLocaleTimeString();
        
        let novaLinha = `<tr>
            <td>${agora}</td>
            <td>${modulo}</td>
            <td>${alvo}</td>
            <td><span style="color: #00b894;">Sucesso</span></td>
        </tr>`;
        
        tabela.insertAdjacentHTML('afterbegin', novaLinha);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MD Buscas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0b0b; color: #ffffff; padding: 16px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-area { font-weight: bold; font-size: 18px; color: #00ffcc; }
        
        .titulo-dash { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #fff; }

        .card-saldo { background: #161616; border: 1px solid #262626; border-radius: 14px; padding: 20px; margin-bottom: 20px; }
        .card-label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .card-valor { font-size: 32px; font-weight: bold; color: #fff; }

        .section-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 12px; }
        
        .lista-pedidos { display: flex; flex-direction: column; gap: 10px; }
        .pedido-card { background: #161616; border: 1px solid #333; border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .pedido-info { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #aaa; }
        .pedido-info b { color: #fff; font-size: 14px; }
        
        .btn-liberar { background: #00c853; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-liberar:active { background: #009624; }
        
        .vazio { text-align: center; color: #555; padding: 40px; font-size: 13px; background: #121212; border-radius: 12px; border: 1px dashed #222; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">⚡ MD BUSCAS (Admin)</div>
    </div>

    <div class="titulo-dash">Controle de Pagamentos</div>

    <div class="card-saldo">
        <div class="card-label">Aguardando Confirmação Manual</div>
        <div class="card-valor" id="txtPendentes">1</div>
    </div>

    <div class="section-title">Fila de Pix para Liberar</div>

    <div class="lista-pedidos" id="containerFila">
        <!-- Exemplo visual de um pedido aguardando liberação manual -->
        <div class="pedido-card">
            <div class="pedido-info">
                <b>Cliente / Ref: md_1722800000</b>
                <span>Valor: R$ 10,00</span>
                <span style="color: #ff9800;">Status: Aguardando Comprovante</span>
            </div>
            <button class="btn-liberar" onclick="liberarConsulta('md_1722800000')">Liberar</button>
        </div>
    </div>

    <script>
        function liberarConsulta(txid) {
            if(confirm("Deseja realmente liberar a consulta para este cliente?")) {
                alert("Consulta liberada com sucesso! O cliente já pode consultar.");
                // Aqui você pode adicionar a lógica para atualizar o status no servidor
                location.reload();
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Dashboard - MD Buscas (Admin)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .logo { font-size: 20px; font-weight: bold; color: #00ffcc; }
        .badge-alerta { background: #ff3333; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; animation: piscar 1s infinite; }
        @keyframes piscar { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .card { background: #161616; border: 1px solid #262626; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .card-title { font-size: 14px; color: #888; margin-bottom: 5px; }
        .card-value { font-size: 24px; font-weight: bold; }
        
        .section-title { font-size: 16px; margin: 20px 0 10px 0; color: #ccc; }
        
        .pedido-item { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .pedido-info { font-size: 13px; color: #bbb; }
        .btn-aprovar { background: #00c853; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-aprovar:active { background: #009624; }
        
        /* Simulação de som invisível */
        #audio-notificacao { display: none; }
    </style>
</head>

    <!-- Som de alerta estilo iFood (Gerado via AudioContext do navegador para não precisar baixar arquivo mp3) -->
    <script>
        function tocarAlertaIfood() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15); // Nota A5
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {
                console.log("Áudio bloqueado pelo navegador até o primeiro toque na tela.");
            }
        }

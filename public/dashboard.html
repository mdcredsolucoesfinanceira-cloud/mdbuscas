<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - MD BUSCAS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #000; color: #fff; padding: 20px; }
    h1 { color: #00ffcc; font-size: 1.4rem; margin-bottom: 4px; }
    .subtitulo { color: #94a3b5; font-size: 0.8rem; margin-bottom: 20px; }

    .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .topo a { color: #94a3b5; font-size: 0.8rem; text-decoration: none; }

    .barra-botoes { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    #btnAtualizar, #btnNotificacoes {
      background: #284b7a; color: #fff; border: none; padding: 8px 14px;
      border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    #btnNotificacoes.ativado { background: #2ecc71; color: #000; font-weight: bold; }

    .cards-resumo {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }
    .card-resumo {
      background: #101c2e;
      border: 1px solid rgba(0,255,204,0.25);
      border-radius: 10px;
      padding: 14px;
    }
    .card-resumo .valor { font-size: 1.5rem; font-weight: bold; color: #00ffcc; }
    .card-resumo .rotulo { font-size: 0.75rem; color: #94a3b5; margin-top: 4px; }

    .secao { margin-bottom: 25px; }
    .secao h2 { font-size: 1rem; color: #00ffcc; margin-bottom: 10px; }

    .barra-modulo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.85rem; }
    .barra-modulo .nome { width: 70px; flex-shrink: 0; }
    .barra-modulo .trilha { flex: 1; background: #101c2e; border-radius: 4px; height: 18px; overflow: hidden; }
    .barra-modulo .preenchimento { background: #00ffcc; height: 100%; }
    .barra-modulo .qtd { width: 40px; text-align: right; flex-shrink: 0; }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #222; }
    th { color: #00ffcc; }

    .card-pedido {
      border: 1px solid #00ffcc; padding: 15px; margin-bottom: 10px; border-radius: 8px;
      font-size: 0.85rem;
    }
    .card-pedido.aprovado { border-color: #2ecc71; opacity: 0.7; }
    .selo-aprovado { color: #2ecc71; font-weight: bold; display: block; margin-top: 10px; }
    .btn-aprovar {
      background: #00ffcc; color: #000; border: none; padding: 10px; cursor: pointer;
      font-weight: bold; width: 100%; margin-top: 10px; border-radius: 5px;
    }
    .btn-aprovar:hover { background: #00b38f; }
  </style>
</head>
<body>

  <div class="topo">
    <h1>[ PAINEL MD BUSCAS ]</h1>
    <a href="#" onclick="fetch('/api/logout',{method:'POST'}).then(()=>location.href='/login.html')">← Sair</a>
  </div>
  <p class="subtitulo">Aprovação de pedidos e estatísticas</p>

  <div class="barra-botoes">
    <button id="btnAtualizar" onclick="carregar()">Atualizar</button>
    <button id="btnNotificacoes" onclick="alternarNotificacoes()">🔔 Ativar notificações</button>
  </div>

  <div class="cards-resumo">
    <div class="card-resumo">
      <div class="valor" id="valReceita">R$ 0,00</div>
      <div class="rotulo">Receita total (aprovados)</div>
    </div>
    <div class="card-resumo">
      <div class="valor" id="valAprovados">0</div>
      <div class="rotulo">Consultas aprovadas</div>
    </div>
    <div class="card-resumo">
      <div class="valor" id="valPendentes">0</div>
      <div class="rotulo">Aguardando pagamento</div>
    </div>
    <div class="card-resumo">
      <div class="valor" id="valTotal">0</div>
      <div class="rotulo">Total de pedidos gerados</div>
    </div>
  </div>

  <div class="secao">
    <h2>Consultas por módulo</h2>
    <div id="porModulo"></div>
  </div>

  <div class="secao">
    <h2>Histórico por dia</h2>
    <table>
      <thead><tr><th>Data</th><th>Consultas</th><th>Receita</th></tr></thead>
      <tbody id="corpoPorDia"></tbody>
    </table>
  </div>

  <div class="secao">
    <h2>Pedidos — Aprovar pagamentos</h2>
    <div id="listaPedidos">Carregando...</div>
  </div>

  <script>
    async function carregarEstatisticas() {
      const res = await fetch('/api/admin/estatisticas');
      const d = await res.json();
      if (!d.sucesso) return;

      document.getElementById('valReceita').innerText = 'R$ ' + d.receitaTotal.toFixed(2).replace('.', ',');
      document.getElementById('valAprovados').innerText = d.totalAprovados;
      document.getElementById('valPendentes').innerText = d.totalPendentes;
      document.getElementById('valTotal').innerText = d.totalPedidos;

      const maxModulo = Math.max(1, ...Object.values(d.porModulo));
      document.getElementById('porModulo').innerHTML = Object.entries(d.porModulo).map(([nome, qtd]) => `
        <div class="barra-modulo">
          <div class="nome">${nome}</div>
          <div class="trilha"><div class="preenchimento" style="width:${(qtd / maxModulo) * 100}%"></div></div>
          <div class="qtd">${qtd}</div>
        </div>
      `).join('') || '<p style="color:#94a3b5;font-size:0.85rem;">Nenhuma consulta aprovada ainda.</p>';

      document.getElementById('corpoPorDia').innerHTML = d.porDia.map(item => `
        <tr><td>${item.dia}</td><td>${item.quantidade}</td><td>R$ ${item.receita.toFixed(2).replace('.', ',')}</td></tr>
      `).join('') || '<tr><td colspan="3" style="color:#94a3b5;">Sem dados ainda.</td></tr>';
    }

    async function carregarPedidos() {
      try {
        let res = await fetch('/api/admin/pedidos');
        let lista = await res.json();
        let container = document.getElementById('listaPedidos');
        if (!lista || lista.length === 0) {
          container.innerHTML = '<p>Nenhum pedido no momento.</p>';
          return;
        }
        container.innerHTML = lista.map(p => {
          const aprovado = ['aprovado','paid','approved','completed','sucesso'].includes(p.status);
          return `
            <div class="card-pedido ${aprovado ? 'aprovado' : ''}">
              <b>ID do Pedido:</b> ${p.txid} <br>
              <b>Módulo:</b> ${p.modulo || '-'} <br>
              <b>Referência:</b> ${p.alvo} <br>
              <b>Data:</b> ${p.data} <br>
              ${aprovado
                ? '<span class="selo-aprovado">✅ Aprovado</span>'
                : `<button class="btn-aprovar" onclick="aprovarPedido('${p.txid}')">APROVAR PAGAMENTO ✅</button>`
              }
            </div>`;
        }).join('');
      } catch (e) { console.error(e); }
    }

    async function aprovarPedido(txid) {
      if (confirm("Tem certeza que o Pix caiu na conta e deseja liberar?")) {
        await fetch('/api/admin/aprovar/' + txid, { method: 'POST' });
        carregar();
      }
    }

    function carregar() {
      carregarEstatisticas();
      carregarPedidos();
    }

    carregar();
    setInterval(carregar, 15000);

    // ===== Notificações Push =====
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }

    async function verificarStatusNotificacoes() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const registration = await navigator.serviceWorker.ready;
      const sub = await registration.pushManager.getSubscription();
      const btn = document.getElementById('btnNotificacoes');
      if (sub) {
        btn.innerText = '🔔 Notificações ativadas';
        btn.classList.add('ativado');
      } else {
        btn.innerText = '🔔 Ativar notificações';
        btn.classList.remove('ativado');
      }
    }

    async function alternarNotificacoes() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        alert('Seu navegador não suporta notificações push.');
        return;
      }

      const registration = await navigator.serviceWorker.ready;
      const subExistente = await registration.pushManager.getSubscription();

      if (subExistente) {
        await subExistente.unsubscribe();
        await verificarStatusNotificacoes();
        return;
      }

      const permissao = await Notification.requestPermission();
      if (permissao !== 'granted') {
        alert('Permissão de notificação negada. Ative nas configurações do navegador.');
        return;
      }

      const resKey = await fetch('/api/push/public-key');
      const { publicKey } = await resKey.json();
      if (!publicKey) {
        alert('Notificações não configuradas no servidor ainda.');
        return;
      }

      const sub = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });

      await fetch('/api/push/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub)
      });

      await verificarStatusNotificacoes();
      alert('Notificações ativadas! Você vai receber um aviso a cada consulta paga.');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(() => {
        verificarStatusNotificacoes();
      }).catch(err => console.log('SW erro:', err));
    }
  </script>
</body>
</html>

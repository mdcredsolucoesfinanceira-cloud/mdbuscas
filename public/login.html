<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - MD BUSCAS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Segoe UI', sans-serif; }
    body {
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ===== CENA DE ANIMAÇÃO (6s no total) ===== */
    #cena {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    #personagem {
      position: absolute;
      bottom: 34%;
      left: -140px;
      width: 100px;
      animation: andar 3.6s cubic-bezier(.4,0,.2,1) forwards;
    }
    @keyframes andar {
      0%   { left: -140px; }
      80%  { left: calc(50% - 50px); }
      100% { left: calc(50% - 50px); }
    }

    #personagem svg { width: 100%; display: block; }

    #personagem .perna-esq { animation: passo 0.4s ease-in-out infinite alternate; transform-origin: top center; }
    #personagem .perna-dir { animation: passo 0.4s ease-in-out infinite alternate-reverse; transform-origin: top center; }
    @keyframes passo {
      0%   { transform: rotate(-10deg); }
      100% { transform: rotate(10deg); }
    }

    #maleta {
      position: absolute;
      bottom: 34%;
      left: calc(50% - 8px);
      width: 32px;
      opacity: 0;
      animation: soltarMaleta 0.5s ease forwards;
      animation-delay: 3.3s;
    }
    @keyframes soltarMaleta {
      0%   { opacity: 0; transform: translateY(0) scale(1); }
      40%  { opacity: 1; transform: translateY(-5px) scale(1); }
      100% { opacity: 1; transform: translateY(8px) scale(1); }
    }

    /* fumaça branca subindo */
    .fumaca {
      position: absolute;
      bottom: calc(34% - 5px);
      left: 50%;
      width: 30px; height: 30px;
      border-radius: 50%;
      filter: blur(6px);
      opacity: 0;
      animation: subirFumaca 2.2s ease-out forwards;
    }
    @keyframes subirFumaca {
      0%   { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
      12%  { opacity: 0.85; }
      100% { opacity: 0; transform: translate(var(--dx), -180px) scale(var(--esc)); }
    }

    #flashExplosao {
      position: absolute;
      bottom: calc(34% - 10px);
      left: 50%;
      width: 10px; height: 10px;
      transform: translate(-50%, 50%);
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #dcdcdc 35%, rgba(255,255,255,0) 70%);
      opacity: 0;
      animation: explodir 0.6s ease-out forwards;
      animation-delay: 3.95s;
    }
    @keyframes explodir {
      0%   { opacity: 0; width: 10px; height: 10px; }
      15%  { opacity: 1; }
      100% { opacity: 0; width: 480px; height: 480px; }
    }

    #personagem.sumir, #maleta.sumir {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    /* ===== FORMULÁRIO ===== */
    .box {
      width: 100%;
      max-width: 320px;
      text-align: center;
      position: relative;
      z-index: 10;
      padding: 0 20px;
    }
    .box h1 {
      color: #ffffff;
      margin-bottom: 22px;
      font-size: 1.15rem;
      font-weight: 700;
      opacity: 0;
      animation: subirCampo 0.5s ease forwards;
      animation-delay: 4.1s;
    }
    .campo {
      opacity: 0;
      transform: translateY(24px);
      animation: subirCampo 0.5s cubic-bezier(.2,.8,.2,1) forwards;
    }
    #campoUsuario { animation-delay: 4.2s; }
    #campoSenha   { animation-delay: 4.4s; }
    #botaoEntrar  { animation-delay: 4.6s; }
    @keyframes subirCampo {
      0%   { opacity: 0; transform: translateY(24px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    input {
      width: 100%; padding: 13px; margin: 8px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
      font-size: 1rem; background: #14141c; color: #fff;
    }
    input::placeholder { color: #9aa0ac; }
    button {
      width: 100%; padding: 13px; background: #ffffff; color: #0a0a0a; border: none;
      border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 12px; font-size: 0.9rem;
    }
    #erro { color: #ef4444; margin-top: 10px; font-size: 0.85rem; min-height: 1em; }
  </style>
</head>
<body>

  <div id="cena">
    <!-- Homem de terno completo -->
    <div id="personagem">
      <svg viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">
        <!-- cabeça -->
        <ellipse cx="50" cy="18" rx="12" ry="14" fill="#e0b088"/>
        <!-- cabelo -->
        <path d="M38 12 C38 4 62 4 62 12 C62 8 58 6 50 6 C42 6 38 8 38 12 Z" fill="#2a2018"/>
        <!-- pescoço -->
        <rect x="45" y="30" width="10" height="8" fill="#e0b088"/>
        <!-- torso: blazer -->
        <path d="M50 36 C30 38 24 55 26 78 L28 100 L72 100 L74 78 C76 55 70 38 50 36 Z" fill="#1c1c26"/>
        <!-- lapelas -->
        <path d="M50 38 L38 48 L42 60 L50 50 Z" fill="#14141c"/>
        <path d="M50 38 L62 48 L58 60 L50 50 Z" fill="#14141c"/>
        <!-- camisa -->
        <path d="M46 38 L50 50 L54 38 L52 46 L48 46 Z" fill="#f5f5f5"/>
        <!-- gravata vermelha -->
        <path d="M48 44 L52 44 L54 52 L50 90 L46 52 Z" fill="#c81e2e"/>
        <!-- botão do blazer -->
        <circle cx="50" cy="80" r="1.6" fill="#0a0a0a"/>
        <!-- braço esquerdo (parado, ao lado do corpo) -->
        <path class="braco-esq" d="M30 46 C24 55 22 68 24 82 L30 84 C29 70 30 58 34 48 Z" fill="#1c1c26"/>
        <!-- punho e mão esquerda -->
        <ellipse cx="26" cy="86" rx="4" ry="5" fill="#e0b088"/>
        <!-- braço direito (segurando a maleta) -->
        <path class="braco" d="M70 46 C78 54 82 66 82 78 L74 82 C74 70 72 58 66 48 Z" fill="#1c1c26"/>
        <!-- punho e mão direita -->
        <ellipse cx="80" cy="82" rx="4" ry="5" fill="#e0b088"/>
        <!-- calça -->
        <path class="perna-esq" d="M32 100 L28 150 L40 150 L44 106 Z" fill="#14141c"/>
        <path class="perna-dir" d="M68 100 L72 150 L60 150 L56 106 Z" fill="#14141c"/>
        <!-- sapatos -->
        <ellipse cx="30" cy="152" rx="8" ry="4" fill="#0a0a0a"/>
        <ellipse cx="70" cy="152" rx="8" ry="4" fill="#0a0a0a"/>
      </svg>
    </div>

    <div id="maleta">
      <svg viewBox="0 0 40 30" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="8" width="36" height="20" rx="3" fill="#1a1a1a" stroke="#ffffff" stroke-width="1"/>
        <path d="M14 8 L14 3 C14 1 15 0 17 0 L23 0 C25 0 26 1 26 3 L26 8" fill="none" stroke="#1a1a1a" stroke-width="3"/>
        <rect x="17" y="15" width="6" height="4" rx="1" fill="#ffffff"/>
      </svg>
    </div>

    <div id="flashExplosao"></div>
    <div id="fumacaContainer"></div>
  </div>

  <div class="box">
    <h1>MD BUSCAS — Acesso Admin</h1>
    <input class="campo" type="text" id="campoUsuario" placeholder="Usuário" autocomplete="username">
    <input class="campo" type="password" id="campoSenha" placeholder="Senha" autocomplete="current-password">
    <button class="campo" id="botaoEntrar" onclick="entrar()">Entrar</button>
    <p id="erro"></p>
  </div>

  <script>
    // gera nuvens de fumaça toda branca
    const container = document.getElementById('fumacaContainer');
    const cores = ['#ffffff', '#f0f0f0', '#e8e8e8', '#fafafa'];
    const qtdFumaca = 16;
    for (let i = 0; i < qtdFumaca; i++) {
      const f = document.createElement('div');
      f.className = 'fumaca';
      const dx = (Math.random() - 0.5) * 260;
      const escala = 4 + Math.random() * 5;
      const tamanho = 20 + Math.random() * 25;
      f.style.width = tamanho + 'px';
      f.style.height = tamanho + 'px';
      f.style.background = cores[Math.floor(Math.random() * cores.length)];
      f.style.setProperty('--dx', `calc(-50% + ${dx}px)`);
      f.style.setProperty('--esc', escala);
      f.style.animationDelay = `${3.95 + Math.random() * 0.5}s`;
      container.appendChild(f);
    }

    // esconde personagem e maleta depois da explosão
    setTimeout(() => {
      document.getElementById('personagem').classList.add('sumir');
      document.getElementById('maleta').classList.add('sumir');
    }, 4050);

    async function entrar() {
      const usuario = document.getElementById('campoUsuario').value;
      const senha = document.getElementById('campoSenha').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, senha })
      });
      const data = await res.json();
      if (data.sucesso) {
        window.location.href = '/dashboard.html';
      } else {
        document.getElementById('erro').innerText = data.erro || 'Erro ao entrar';
      }
    }
    document.getElementById('campoSenha').addEventListener('keydown', e => {
      if (e.key === 'Enter') entrar();
    });
  </script>
</body>
</html>

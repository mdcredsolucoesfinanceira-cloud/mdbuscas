<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MD BUSCAS - Consulta de CNPJ</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .box { background: #111; border: 1px solid #00ffcc; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 10px rgba(0,255,204,0.2); }
    input { width: 90%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 16px; }
    button { background: #00ffcc; color: #000; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 16px; margin-top: 10px; }
    button:hover { background: #00b38f; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    .modal-conteudo { background: #111; border: 1px solid #00ffcc; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
    pre { background: #1a1a1a; color: #00ffcc; padding: 10px; border-radius: 5px; text-align: left; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>

    <div class="box">
        <h2>MD BUSCAS</h2>
        <p>Digite o CNPJ para consultar:</p>
        <input type="text" id="inputCnpj" placeholder="00.000.000/0001-00">
        <button onclick="gerarPagamento()">Consultar (Pix R$ 10,00)</button>
    </div>

    <!-- MODAL DE PAGAMENTO E RESULTADO -->
    <div id="modalPagamento" class="modal">
        <div class="modal-conteudo" id="modalConteudoInterno">
            <h3 style="color:#00ffcc">Pague o Pix para Liberar</h3>
            <div id="areaQrCode">
                <img id="imgQrCode" src="" alt="QR Code Pix" style="width:150px; height:150px; background:#fff; padding:5px; border-radius:5px;"><br><br>
                <input type="text" id="copiaCola" readonly style="font-size:12px; text-align:center;">
                <button onclick="copiarPix()">Copiar Código Pix</button>
            </div>
            <p id="statusPagamento" style="color:orange; margin-top:15px; font-weight:bold;">Aguardando confirmação do pagamento...</p>
            <a id="btnSuporte" href="https://wa.me/" target="_blank" style="display:block; margin-top:10px; color:#00ffcc; text-decoration:underline; font-size:14px;">Já fez o pagamento? Informe ao suporte</a>
            <button onclick="fecharModal()" style="background:#ff4d4d; color:#fff; margin-top:15px;">Fechar</button>
        </div>
    </div>

    <script>
        let intervaloChecagem = null;
        let txidAtual = null;
        let cnpjAtual = null;

        async function gerarPagamento() {
            cnpjAtual = document.getElementById('inputCnpj').value.replace(/\D/g, '');
            if (!cnpjAtual || cnpjAtual.length !== 14) {
                alert('Digite um CNPJ válido com 14 dígitos!');
                return;
            }

            document.getElementById('modalPagamento').style.display = 'flex';
            document.getElementById('statusPagamento').innerText = 'Gerando Pix...';

            try {
                let res = await fetch('/api/pagamento/pix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cnpj: cnpjAtual })
                });
                let data = await res.json();

                if (data.sucesso) {
                    txidAtual = data.txid;
                    document.getElementById('imgQrCode').src = data.qrcode_image;
                    document.getElementById('copiaCola').value = data.qrcode;
                    document.getElementById('statusPagamento').innerText = 'Aguardando confirmação do pagamento...';
                    
                    // Inicia a checagem se o Admin aprovou
                    if (intervaloChecagem) clearInterval(intervaloChecagem);
                    intervaloChecagem = setInterval(checarStatusPagamento, 3000);
                } else {
                    alert('Erro ao gerar Pix');
                }
            } catch (e) {
                console.error(e);
                alert('Erro de conexão ao gerar Pix.');
            }
        }

        function copiarPix() {
            let inputCp = document.getElementById('copiaCola');
            inputCp.select();
            document.execCommand('copy');
            alert('Código Pix copiado com sucesso!');
        }

        async function checarStatusPagamento() {
            if (!txidAtual) return;
            try {
                let res = await fetch('/api/pagamento/status/' + txidAtual);
                let data = await res.json();

                if (data.pago) {
                    clearInterval(intervaloChecagem);
                    document.getElementById('statusPagamento').innerText = 'Pagamento confirmado! Buscando dados...';
                    
                    // Busca os dados do CNPJ nas APIs unificadas
                    buscarDadosCnpj();
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function buscarDadosCnpj() {
            try {
                let res = await fetch('/api/consulta/cnpj/' + cnpjAtual);
                let dados = await res.json();

                if (dados.sucesso) {
                    let textoFormatado = `
=== DADOS DA EMPRESA ===
Razão Social: ${dados.razao_social || 'N/A'}
Nome Fantasia: ${dados.nome_fantasia || 'N/A'}
CNPJ: ${dados.cnpj || 'N/A'}
Situação: ${dados.situacao || 'N/A'}
Abertura: ${dados.abertura || 'N/A'}
Atividade: ${dados.atividade_principal || 'N/A'}
Endereço: ${dados.logradouro || 'N/A'}
Telefone: ${dados.telefone || 'N/A'}
E-mail: ${dados.email || 'N/A'}
                    `.trim();

                    document.getElementById('modalConteudoInterno').innerHTML = `
                        <h3 style="color:#00ffcc">Consulta Realizada!</h3>
                        <pre>${textoFormatado}</pre>
                        <button onclick="copiarDados('${btoa(unescape(encodeURIComponent(textoFormatado)))}')">📋 COPIAR TODOS OS DADOS</button>
                        <button onclick="fecharModal()" style="background:#444; color:#fff; margin-top:10px;">Fechar</button>
                    `;
                } else {
                    document.getElementById('statusPagamento').innerText = 'Erro ao buscar dados do CNPJ.';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('statusPagamento').innerText = 'Erro ao carregar dados.';
            }
        }

        function copiarDados(base64Text) {
            let textoOriginal = decodeURIComponent(escape(atob(base64Text)));
            navigator.clipboard.writeText(textoOriginal).then(() => {
                alert('Dados copiados para a área de transferência!');
            });
        }

        function fecharModal() {
            if (intervaloChecagem) clearInterval(intervaloChecagem);
            document.getElementById('modalPagamento').style.display = 'none';
            location.reload();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MD Buscas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0b0b; color: #ffffff; padding: 16px; }

        /* Topo igual Goatpay */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; color: #fff; }
        .top-icons { display: flex; gap: 10px; }
        .icon-btn { background: #161616; border: 1px solid #262626; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; cursor: pointer; position: relative; }
        .badge-notif { position: absolute; top: -2px; right: -2px; background: #ff3333; color: white; font-size: 9px; padding: 2px 5px; border-radius: 10px; font-weight: bold; }

        /* Saudação */
        .saudacao { font-size: 14px; color: #888; margin-bottom: 4px; }
        .titulo-dash { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #fff; }

        /* Cards de Saldo / Resumo */
        .card-saldo { background: #161616; border: 1px solid #262626; border-radius: 14px; padding: 20px; margin-bottom: 15px; }
        .card-label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .card-valor { font-size: 32px; font-weight: bold; color: #fff; }

        /* Grid de métricas secundárias */
        .grid-duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .card-mini { background: #161616; border: 1px solid #262626; border-radius: 12px; padding: 15px; }
        .card-mini-valor { font-size: 18px; font-weight: bold; margin-top: 5px; color: #fff; }

        /* Seção de Fila */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 25px 0 12px 0; }
        .section-title { font-size: 16px; font-weight: bold; color: #fff; }
        
        .lista-pedidos { display: flex; flex-direction: column; gap: 10px; }
        .pedido-card { background: #161616; border: 1px solid #262626; border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .pedido-info { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #aaa; }
        .pedido-info b { color: #fff; font-size: 14px; }
        
        .btn-liberar { background: #00c853; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
        .btn-liberar:active { background: #009624; }
        
        .vazio { text-align: center; color: #555; padding: 40px; font-size: 13px; background: #121212; border-radius: 12px; border: 1px dashed #222; }
    </style>
</head>
<body>

    <!-- Topo -->
    <div class="header">
        <div class="logo-area">
            <span>⚡ MD BUSCAS</span>
        </div>
        <div class="top-icons">
            <div class="icon-btn">👁️</div>
            <div class="icon-btn">
                🔔
                <span class="badge-notif" id="badgeQtd">0</span>
            </div>
            <div class="icon-btn">☼</div>
        </div>
    </div>

    <!-- Saudação e Título -->
    <div class="saudacao">Boa tarde, MD 👋</div>
    <div class="titulo-dash">Dashboard</div>

    <!-- Card Principal de Saldo/Pendentes -->
    <div class="card-saldo">
        <div class="card-label">Consultas Pendentes de Liberação</div>
        <div class="card-valor" id="txtPendentes">0</div>
    </div>

    <!-- Grid Recebido / Enviado -->
    <div class="grid-duplo">
        <div class="card-mini">
            <div class="card-label">RECEBIDO HOJE</div>
            <div class="card-mini-valor" style="color: #00c853;">R$ 0,00</div>
        </div>
        <div class="card-mini">
            <div class="card-label">LIBERADAS</div>
            <div class="card-mini-valor">0</div>
        </div>
    </div>

    <!-- Fila de Pedidos Manual -->
    <div class="section-header">
        <div class="section-title">Fila de Pagamentos Pix</div>
    </div>

    <div class="lista-pedidos" id="containerFila">
        <div class="vazio">Nenhum pagamento pendente no momento.</div>
    </div>

    <script>
        // Alerta sonoro tipo iFood para novos pedidos
        function tocarAlarmeIfood() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.log("Áudio aguardando interação.");
            }
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - MD Buscas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .logo { font-size: 22px; font-weight: bold; color: #00ffcc; }
        .badge-status { background: #ff3333; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: none; }
        
        .card { background: #161616; border: 1px solid #262626; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .card-title { font-size: 13px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-value { font-size: 28px; font-weight: bold; }
        
        .section-title { font-size: 16px; margin: 25px 0 12px 0; color: #ccc; font-weight: 600; }
        
        .lista-container { display: flex; flex-direction: column; gap: 10px; }
        .pedido-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .pedido-info { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: #bbb; }
        .pedido-info strong { color: #fff; }
        
        .btn-liberar { background: #00c853; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-liberar:active { background: #009624; }
        
        .vazio { text-align: center; color: #555; padding: 30px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ MD BUSCAS (Admin)</div>
        <div id="badgeAlerta" class="badge-status">NOVO PEDIDO!</div>
    </div>

    <!-- Cards Estilo Goatpay -->
    <div class="card">
        <div class="card-title">Pendentes para Liberação</div>
        <div class="card-value" id="totalPendentes">0</div>
    </div>

    <div class="section-title">Fila de Pagamentos Pix</div>
    <div id="containerPedidos" class="lista-container">
        <div class="vazio">Nenhum pagamento pendente no momento.</div>
    </div>

    <script>
        // Função de alerta sonoro estilo iFood
        function tocarAlarme() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (e) {
                console.log("Áudio aguardando interação na tela.");
            }
        }

        // Exemplo de atualização de dados limpa
        function atualizarDashboard() {
            // Aqui futuramente você fará o fetch para o seu back-end buscar os pedidos pendentes
            // Exemplo:
            // fetch('/api/admin/pedidos-pendentes')
            //   .then(res => res.json())
            //   .then(dados => { ... })
        }

        // Executa verificação a cada 5 segundos
        setInterval(atualizarDashboard, 5000);
    </script>

</body>
</html>
